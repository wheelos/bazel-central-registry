name: Publish BCR to Cloudflare R2

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base:
        description: Last validated registry commit to compare against
        required: true
        type: string
      run_consumers:
        description: Also run changed modules' consumer builds before publication
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: registry-production
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'wheelos/bazel-central-registry'
    runs-on: ubuntu-22.04
    outputs:
      base: ${{ steps.base.outputs.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve registry validation base
        id: base
        env:
          BASE_REF: ${{ inputs.base || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "push" ]]; then
            BASE_REF=$(python3 tools/check_registry_changes.py \
              --base "$BASE_REF" --resolve-base-if-empty)
          fi
          BASE_REF=$(git rev-parse --verify --end-of-options "${BASE_REF}^{commit}")
          echo "base=$BASE_REF" >> "$GITHUB_OUTPUT"

  validate:
    if: github.repository == 'wheelos/bazel-central-registry'
    needs: prepare
    uses: ./.github/workflows/validate-modules.yml
    with:
      base: ${{ needs.prepare.outputs.base }}
      run_consumers: ${{ inputs.run_consumers == true }}

  deploy:
    needs: [prepare, validate]
    runs-on: ubuntu-22.04
    environment: registry-production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Publish add-only objects and verify remote contents
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.CF_ACCOUNT_ID }}.r2.cloudflarestorage.com
          VALIDATED_VERSIONS: ${{ needs.validate.outputs.versions }}
          BASE_REF: ${{ needs.prepare.outputs.base }}
        run: |
          printf '%s\n' "$VALIDATED_VERSIONS" > "$RUNNER_TEMP/registry-validated-versions.json"
          python3 tools/publish_registry.py \
            --bucket wheelos-bazel-registry --endpoint-url "$R2_ENDPOINT" \
            --validated-versions "$RUNNER_TEMP/registry-validated-versions.json" \
            --base "$BASE_REF"

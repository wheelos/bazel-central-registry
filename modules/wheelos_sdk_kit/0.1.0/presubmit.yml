matrix:
  platform:
    - ubuntu2204
    - ubuntu2204_arm64
  bazel:
    - 7.x

tasks:
  verify_targets:
    name: Verify WheelOS SDK Kit targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_flags:
      - '--cxxopt=-std=c++17'
      - '--host_cxxopt=-std=c++17'
    build_targets:
      - '@wheelos_sdk_kit//...'
